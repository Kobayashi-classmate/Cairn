#
# needrestart runs at the end of an apt transaction and restarts the units
# whose processes still use a library that was just replaced. Cairn runs the
# package manager in units of its own, and those units hold the very apt-get
# needrestart was called from: restarting one would end the transaction in
# its last steps and report a finished update as failed. They are never
# restarted, like the distribution's own apt units.
$nrconf{override_rc}{qr(^cairn-pkg\.service$)} = 0;
$nrconf{override_rc}{qr(^cairn-update-\d+\.service$)} = 0;
