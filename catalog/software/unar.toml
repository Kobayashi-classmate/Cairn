# SPDX-License-Identifier: AGPL-3.0-only
# The Unarchiver's command-line tools (unar, lsar), from the system
# repositories: the file manager uses them to extract 7z and RAR archives
# (zip and tar it handles itself). EL has them only in EPEL, which the
# panel does not add. Checked 2026-11-16.
id = "unar"
name = "The Unarchiver (unar)"
category = "tool"
homepage = "https://theunarchiver.com/command-line"

lines = [
  { version = "1.10" },
]

[[sources]]
method = "system"
releases = ["debian-12", "debian-13", "ubuntu-22.04", "ubuntu-24.04", "ubuntu-26.04"]
lines = ["1.10"]
packages = ["unar"]
