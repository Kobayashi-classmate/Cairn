[[sources]]
method = "vendor"
repo = "nginx"
releases = ["debian-12", "debian-13", "ubuntu-22.04", "ubuntu-24.04", "ubuntu-26.04", "el-9", "el-10"]
lines = ["1.30"]
packages = ["nginx"]
services = ["nginx"]
configs = [
  { id = "nginx.conf", path = "/etc/nginx/nginx.conf", check = ["/usr/sbin/nginx", "-t"], apply = "reload" },
]

