# EL 9: AppStream module streams; only one can be enabled at a time.
[[sources]]
method = "system"
releases = ["el-9"]
lines = ["1.26", "1.24", "1.22"]
packages = ["nginx", "nginx-mod-stream"]
stream = "nginx:{line}"
services = ["nginx"]
configs = [
  { id = "nginx.conf", path = "/etc/nginx/nginx.conf", check = ["/usr/sbin/nginx", "-t"], apply = "reload" },
]

