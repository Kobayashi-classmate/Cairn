# SPDX-License-Identifier: AGPL-3.0-only
# One nginx per system, from the system repositories (stream module included
# for TCP/UDP proxying). System versions checked 2026-11-14.
id = "nginx"
name = "nginx"
category = "web"
homepage = "https://nginx.org/"
provides = ["web-server"]
single = true

lines = [
  { version = "1.28" },
  { version = "1.26" },
  { version = "1.24" },
  { version = "1.22" },
  { version = "1.20" },
  { version = "1.18" },
]

[[sources]]
method = "system"
releases = ["debian-12"]
lines = ["1.22"]
packages = ["nginx", "libnginx-mod-stream"]
services = ["nginx"]
configs = [
  { id = "nginx.conf", path = "/etc/nginx/nginx.conf", check = ["/usr/sbin/nginx", "-t"], apply = "reload" },
]

