# SPDX-License-Identifier: AGPL-3.0-only
# One nginx per system: nginx.org's stable and mainline branches on every
# release, and the system's own version (with its stream module, for TCP/UDP
# proxying). System versions checked 2026-11-14, nginx.org 2026-11-25.
# The system's nginx has its service in nginx-common, which goes with it
# (its configuration files are kept). On Ubuntu 22.04 nginx is a
# metapackage: the binary is in nginx-core, which depends on these modules,
# and they depend on nginx-common (checked 2026-11-26).
id = "nginx"
name = "nginx"
category = "web"
homepage = "https://nginx.org/"
provides = ["web-server"]
single = true

lines = [
  { version = "1.31", mainline = true },
  { version = "1.30" },
  { version = "1.28" },
  { version = "1.26" },
  { version = "1.24" },
  { version = "1.22" },
  { version = "1.20" },
  { version = "1.18" },
]

[[sources]]
method = "system"
releases = ["debian-12"]
lines = ["1.22"]
packages = ["nginx", "libnginx-mod-stream"]
companions = ["nginx-common"]
services = ["nginx"]
configs = [
  { id = "nginx.conf", path = "/etc/nginx/nginx.conf", check = ["/usr/sbin/nginx", "-t"], apply = "reload" },
]

