services = ["php{line}-fpm"]
fpm = { pool_dir = "/etc/php/{line}/fpm/pool.d", binary = "/usr/sbin/php-fpm{line}", service = "php{line}-fpm", pid_file = "/run/php/php{line}-fpm.pid", socket_dir = "/run/php" }

[[sources]]
method = "system"
releases = ["ubuntu-24.04"]
lines = ["8.3"]
packages = ["php{line}-fpm", "php{line}-cli"]
services = ["php{line}-fpm"]
fpm = { pool_dir = "/etc/php/{line}/fpm/pool.d", binary = "/usr/sbin/php-fpm{line}", service = "php{line}-fpm", pid_file = "/run/php/php{line}-fpm.pid", socket_dir = "/run/php" }

[[sources]]
method = "system"
releases = ["ubuntu-26.04"]
lines = ["8.5"]
packages = ["php{line}-fpm", "php{line}-cli"]

# EL 9: the php:8.3 module stream is the system version; other lines come
# from Remi's parallel-installable packages instead of further streams.
services = ["php{line}-fpm"]
fpm = { pool_dir = "/etc/php/{line}/fpm/pool.d", binary = "/usr/sbin/php-fpm{line}", service = "php{line}-fpm", pid_file = "/run/php/php{line}-fpm.pid", socket_dir = "/run/php" }

[[sources]]
method = "system"
releases = ["el-9"]
lines = ["8.3"]
packages = ["php-fpm", "php-cli"]
stream = "php:{line}"
services = ["php-fpm"]

[[sources]]
method = "system"
releases = ["el-10"]
lines = ["8.3"]
packages = ["php-fpm", "php-cli"]
services = ["php-fpm"]

