# SPDX-License-Identifier: AGPL-3.0-only
# PHP: the system version where there is one, other lines from the approved
# PHP repositories (sury, ondrej, Remi). Lines past upstream support are not
# installed natively. Checked 2026-11-14; 8.6 is still a release candidate.
id = "php"
name = "PHP"
category = "runtime"
homepage = "https://www.php.net/"

# fpm: where the line's PHP-FPM keeps its pools, for per-site pools (the
# Debian layout, shared by the system packages, sury and ondrej; EL sites
# wait for the SELinux verification).
lines = [
  { version = "8.5", eol = "2029-12-31" },
  { version = "8.4", eol = "2028-12-31" },
  { version = "8.3", eol = "2027-12-31" },
  { version = "8.2", eol = "2026-12-31" },
  { version = "8.1", eol = "2025-12-31" },
  { version = "8.0", eol = "2023-11-26" },
  { version = "7.4", eol = "2022-11-28" },
]

[[sources]]
method = "system"
releases = ["debian-12"]
lines = ["8.2"]
packages = ["php{line}-fpm", "php{line}-cli"]
services = ["php{line}-fpm"]
fpm = { pool_dir = "/etc/php/{line}/fpm/pool.d", binary = "/usr/sbin/php-fpm{line}", service = "php{line}-fpm", pid_file = "/run/php/php{line}-fpm.pid", socket_dir = "/run/php" }

[[sources]]
method = "system"
releases = ["debian-13"]
lines = ["8.4"]
packages = ["php{line}-fpm", "php{line}-cli"]
services = ["php{line}-fpm"]
fpm = { pool_dir = "/etc/php/{line}/fpm/pool.d", binary = "/usr/sbin/php-fpm{line}", service = "php{line}-fpm", pid_file = "/run/php/php{line}-fpm.pid", socket_dir = "/run/php" }

