# Extensions the panel installs and removes, by extension family: "deb" is
# Debian and Ubuntu's own PHP and the sury and ondrej builds (all name them
# php{line}-<name>), "el" Enterprise Linux's AppStream PHP (no EPEL), "remi"
# Remi's parallel builds. A family without an entry does not build it; an
# extension that is loaded without a package of its own is built in.
# Checked against the repositories 2026-11-21: PHP 8.5 has OPcache built in.
[[extensions]]
id = "opcache"
name = "OPcache"
modules = ["zend opcache"]
packages = { deb = "php{line}-opcache", el = "php-opcache", remi = "php{line_nodot}-php-opcache" }

[[extensions]]
id = "mysql"
name = "MySQL / MariaDB (mysqli, PDO)"
modules = ["mysqli", "mysqlnd", "pdo_mysql"]
packages = { deb = "php{line}-mysql", el = "php-mysqlnd", remi = "php{line_nodot}-php-mysqlnd" }

[[extensions]]
id = "pgsql"
name = "PostgreSQL (pgsql, PDO)"
modules = ["pgsql", "pdo_pgsql"]
packages = { deb = "php{line}-pgsql", el = "php-pgsql", remi = "php{line_nodot}-php-pgsql" }

[[extensions]]
id = "sqlite3"
