# SPDX-License-Identifier: AGPL-3.0-only
# Valkey, the Redis-compatible fork; the only option on EL 10. Checked
# 2026-11-14.
id = "valkey"
name = "Valkey"
category = "cache"
homepage = "https://valkey.io/"

lines = [
  { version = "9.0" },
  { version = "8.1" },
  { version = "8.0" },
  { version = "7.2" },
]

[[sources]]
method = "system"
releases = ["ubuntu-26.04"]
lines = ["9.0"]
packages = ["valkey-server"]
services = ["valkey-server"]
configs = [
  { id = "valkey.conf", path = "/etc/valkey/valkey.conf", apply = "restart" },
]

[[sources]]
method = "system"
releases = ["debian-13"]
lines = ["8.1"]
packages = ["valkey-server"]
services = ["valkey-server"]
configs = [
  { id = "valkey.conf", path = "/etc/valkey/valkey.conf", apply = "restart" },
]

[[sources]]
method = "system"
releases = ["ubuntu-24.04"]
lines = ["7.2"]
packages = ["valkey-server"]
services = ["valkey-server"]

# EL 9 and 10 AppStream moved from 8.0 to 8.1 (Rocky 9.9, Alma 10.3;
# checked 2026-11-18).
configs = [
  { id = "valkey.conf", path = "/etc/valkey/valkey.conf", apply = "restart" },
]
[[sources]]
method = "system"
releases = ["el-9", "el-10"]
lines = ["8.1"]
packages = ["valkey"]
services = ["valkey"]
configs = [
  { id = "valkey.conf", path = "/etc/valkey/valkey.conf", apply = "restart" },
]
