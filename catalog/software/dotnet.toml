# SPDX-License-Identifier: AGPL-3.0-only
# Official .NET builds (Microsoft release metadata, checked against their
# SHA-512 hashes).
id = "dotnet"
name = ".NET"
category = "runtime"
homepage = "https://dotnet.microsoft.com/"

lines = [
  { version = "10", lts = true, eol = "2028-11-14" },
  { version = "9", eol = "2026-11-10" },
  { version = "8", lts = true, eol = "2026-11-10" },
]

# .NET apps need ICU for globalization; its package carries the ICU
# version in its name on Debian and Ubuntu (checked 2026-11-14).

[[sources]]
method = "standalone"
provider = "dotnet"
releases = ["debian-12"]
lines = ["10", "9", "8"]
arch = ["amd64", "arm64"]
packages = ["libicu72"]

