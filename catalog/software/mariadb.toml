# The MariaDB repositories: Debian's layout and package names on Debian and
# Ubuntu; on EL their own packages (MariaDB-server), with server.cnf and
# /usr/sbin/mariadbd instead of AppStream's mariadb-server.cnf and
# /usr/libexec/mariadbd.

[[sources]]
method = "vendor"
repo = "mariadb"
releases = ["debian-12"]
lines = ["12.3", "11.8", "11.4", "10.11"]
packages = ["mariadb-server"]
services = ["mariadb"]
configs = [
  { id = "50-server.cnf", path = "/etc/mysql/mariadb.conf.d/50-server.cnf", check = ["/usr/sbin/mariadbd", "--help", "--verbose"], apply = "restart" },
]

