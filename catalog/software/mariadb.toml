# SPDX-License-Identifier: AGPL-3.0-only
# MariaDB: the system version, and the long-term support lines from the
# official MariaDB repositories (system versions checked 2026-11-14, the
# MariaDB repositories 2026-11-25; 13.x, the rolling releases, are left
# out).
id = "mariadb"
name = "MariaDB"
category = "database"
homepage = "https://mariadb.org/"
provides = ["mysql-protocol"]
# MariaDB and MySQL share the data directory, the port and package names.
single = true
conflicts = ["mysql"]

lines = [
  { version = "12.3", lts = true, eol = "2029-06-12" },
  { version = "11.8", lts = true, eol = "2028-06-04" },
  { version = "11.4", lts = true, eol = "2029-05-29" },
  { version = "10.11", lts = true, eol = "2028-02-16" },
  { version = "10.6", lts = true, eol = "2026-07-06" },
  { version = "10.5", eol = "2025-06-24" },
]

[[sources]]
method = "system"
releases = ["debian-12", "ubuntu-24.04"]
lines = ["10.11"]
packages = ["mariadb-server"]
services = ["mariadb"]
configs = [
  { id = "50-server.cnf", path = "/etc/mysql/mariadb.conf.d/50-server.cnf", check = ["/usr/sbin/mariadbd", "--help", "--verbose"], apply = "restart" },
]

[[sources]]
method = "system"
releases = ["el-10"]
lines = ["10.11"]
packages = ["mariadb-server"]
services = ["mariadb"]
configs = [
  { id = "mariadb-server.cnf", path = "/etc/my.cnf.d/mariadb-server.cnf", check = ["/usr/libexec/mariadbd", "--help", "--verbose"], apply = "restart" },
]

