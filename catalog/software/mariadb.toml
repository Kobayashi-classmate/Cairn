# The server brings MariaDB-server-compat (the mysqld names, 11.0 and
# later), which depends on it.
[[sources]]
method = "vendor"
repo = "mariadb"
releases = ["el-9"]
lines = ["12.3", "11.8", "11.4", "10.11", "10.6"]
packages = ["MariaDB-server"]
companions = ["MariaDB-server-compat"]
services = ["mariadb"]
configs = [
  { id = "server.cnf", path = "/etc/my.cnf.d/server.cnf", check = ["/usr/sbin/mariadbd", "--help", "--verbose"], apply = "restart" },
]

