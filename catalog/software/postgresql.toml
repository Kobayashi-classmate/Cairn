# SPDX-License-Identifier: AGPL-3.0-only
# PostgreSQL: the system version, other lines from the official PGDG
# repository. Support ends five years after each major release.
id = "postgresql"
name = "PostgreSQL"
category = "database"
homepage = "https://www.postgresql.org/"

lines = [
  { version = "18", eol = "2030-11-14" },
  { version = "17", eol = "2029-11-08" },
  { version = "16", eol = "2028-11-09" },
  { version = "15", eol = "2027-11-11" },
  { version = "14", eol = "2026-11-12" },
  { version = "13", eol = "2025-11-13" },
]

[[sources]]
method = "system"
releases = ["debian-12"]
lines = ["15"]
packages = ["postgresql-{line}"]
services = ["postgresql"]
configs = [
  { id = "postgresql.conf", path = "/etc/postgresql/{line}/main/postgresql.conf", check = ["/usr/sbin/runuser", "-u", "postgres", "--", "/usr/lib/postgresql/{line}/bin/postgres", "-D", "/etc/postgresql/{line}/main", "-C", "data_directory"], apply = "reload" },
]

