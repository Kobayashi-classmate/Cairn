# SPDX-License-Identifier: AGPL-3.0-only
#
# Suites of the first-login wizard (presets): starting points for a kind
# of site. Applying one only adds to the wizard's selection, where every
# row can be removed, given another line or switched to another of its
# item's choices (Valkey for Redis). Each item lists software in order of
# preference: the first one offered on the system is added, in its
# recommended line (EL 10 has no Redis, so the PHP suite takes Valkey
# there).
#
# The project owner chose these two from the design's examples
# (2026-11-14); other software is added one by one. PHP comes without
# extensions until PHP management exists. Docker arrives with P2.

[[suite]]
id = "php-site"
items = [["nginx"], ["php"], ["mariadb"], ["redis", "valkey"]]

[[suite]]
id = "node-java"
items = [["nginx"], ["nodejs"], ["java"]]
