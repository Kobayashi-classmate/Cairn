# nginx.org's mainline branch, the same layout as the stable one
# (nginx.toml). Checked 2026-11-25: 1.31 on every supported release.
id = "nginx-mainline"
name = "nginx.org repository (mainline)"
homepage = "https://nginx.org/en/linux_packages.html"
official = true
releases = ["debian-12", "debian-13", "ubuntu-22.04", "ubuntu-24.04", "ubuntu-26.04", "el-9", "el-10"]
pin_line = true

[apt]
uri = "https://nginx.org/packages/mainline/{distro}"
suite = "{codename}"
components = ["nginx"]
key = { url = "https://nginx.org/keys/nginx_signing.key", fingerprints = ["573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62", "8540A6F18833A80E9C1653A42FD21310B49F6B46", "9E9BE90EACBCDE69FE9B204CBCDCD8A38D88A2B3"] }

[dnf]
baseurl = "https://nginx.org/packages/mainline/rhel/{major}/$basearch/"
key = { url = "https://nginx.org/keys/nginx_signing.key", fingerprints = ["573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62", "8540A6F18833A80E9C1653A42FD21310B49F6B46", "9E9BE90EACBCDE69FE9B204CBCDCD8A38D88A2B3"] }
module_hotfixes = true
