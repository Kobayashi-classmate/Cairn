# SPDX-License-Identifier: AGPL-3.0-only
# PHP builds for Ubuntu by the same maintainer as sury. Approved by the
# project owner. Ubuntu 26.04 is not served yet (checked 2026-11-14).
id = "ondrej-php"
name = "ppa:ondrej/php"
homepage = "https://launchpad.net/~ondrej/+archive/ubuntu/php"
official = false
approved = "2026-11-14"
releases = ["ubuntu-22.04", "ubuntu-24.04"]

# The PPA key (RSA 1024; apt on 24.04 warns about it but accepts it).
[apt]
uri = "https://ppa.launchpadcontent.net/ondrej/php/ubuntu"
suite = "{codename}"
components = ["main"]
key = { url = "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x14AA40EC0831756756D7F66C4F4EA0AAE5267A6C", fingerprints = ["14AA40EC0831756756D7F66C4F4EA0AAE5267A6C"] }
# Their PHP builds need their newer php-common (checked 2026-11-14).
prefer = ["php-common"]
