# SPDX-License-Identifier: AGPL-3.0-only
# Redis's own repositories. Every line is in one repository, so updates are
# pinned to the installed line; on EL it has a single package, redis.
# Checked 2026-11-25.
id = "redis"
name = "Redis repository"
homepage = "https://redis.io/downloads/"
official = true
releases = ["debian-12", "debian-13", "ubuntu-22.04", "ubuntu-24.04", "ubuntu-26.04", "el-9", "el-10"]
pin_line = true

[apt]
uri = "https://packages.redis.io/deb"
suite = "{codename}"
components = ["main"]
key = { url = "https://packages.redis.io/gpg", fingerprints = ["54318FA4052D1E61A6B6F7BB5F4349D6BF53AA0C"] }

# The Rocky Linux builds serve RHEL and AlmaLinux too; one repository holds
# both architectures.
[dnf]
baseurl = "https://packages.redis.io/rpm/rockylinux{major}"
key = { url = "https://packages.redis.io/gpg", fingerprints = ["54318FA4052D1E61A6B6F7BB5F4349D6BF53AA0C"] }
module_hotfixes = true
