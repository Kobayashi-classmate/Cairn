# SPDX-License-Identifier: AGPL-3.0-only
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      # cairn-helper runs as root, and its tests chown files and start
      # processes as other users. The runner user cannot do that, so the tests
      # run as root in the same container `make test` uses locally.
      - name: Test
        run: make test GOPROXY=https://proxy.golang.org,direct
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: No CJK outside locale files
        run: sh scripts/check-cjk.sh

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Locale key parity
        run: npm run check:locales
      - run: npm run typecheck
      - run: npm run build
