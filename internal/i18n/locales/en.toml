# Backend messages (CLI and notifications). English is the source language.
"language.native_name" = "English"

"cli.error" = "Error: {{.Message}}"
"cli.setup_link.already_done" = "Setup is already complete. If you lost the administrator password, run: cairn reset-password"
"cli.setup_link.intro" = "Open one of these links within {{.Minutes}} minutes to create the administrator account:"
"cli.setup_link.cert_note" = "Cairn starts with a self-signed certificate, so your browser will show a security warning. Make sure the address is correct before you continue."
"cli.setup_link.hint" = "To create the administrator account, get a one-time setup link with: sudo cairn setup-link"
"cli.reset_password.done" = "The password of {{.Username}} has been reset. New password: {{.Password}}"
"cli.reset_password.sessions_revoked" = "All signed-in sessions of this user have been signed out."
"cli.reset_password.tokens_kept" = "The API tokens of this user were not revoked and keep working. If one may be known to someone else, delete it in the panel (API tokens)."
"cli.reset_password.no_user" = "There is no user named {{.Username}}."
"cli.reset_password.need_username" = "More than one user exists. Choose one with --username."
"cli.reset_2fa.done" = "Two-step sign-in has been turned off for {{.Username}}. They can sign in with their password and set it up again."
"cli.reset_panel_cert.done" = "The panel serves its self-signed certificate again, within a few seconds. Browsers warn about it: check the address before you continue, then set a certificate they accept on the Certificates page."

# Notifications. Template data: the event parameters plus "host".
"notify.security.lockout.title" = "[Cairn] Sign-in locked on {{.host}}"
"notify.security.lockout.body" = "Repeated failed sign-ins for the account {{.username}} from {{.ip}}. Further attempts are blocked for {{.minutes}} minutes."
"notify.security.login.title" = "[Cairn] New sign-in on {{.host}}"
"notify.security.login.body" = "{{.username}} signed in from {{.ip}}."
"notify.security.totp_disabled.title" = "[Cairn] Two-step sign-in turned off on {{.host}}"
"notify.security.totp_disabled.body" = "Two-step sign-in was turned off for {{.username}} by {{.actor}}."
"notify.users.change.title" = "[Cairn] Account changed on {{.host}}"
"notify.users.change.body" = "{{.actor}}: {{.actionText}} ({{.username}})."
"notify.system.test.title" = "[Cairn] Test message from {{.host}}"
"notify.system.test.body" = "This is a test message sent by {{.actor}}. If you can read it, the channel works."
"notify.system.job_failed.title" = "[Cairn] Background task failed on {{.host}}"
"notify.system.job_failed.body" = "The background task {{.kind}} ({{.id}}) failed with {{.code}}. Open the task center in the panel for its log."
"notify.action.create" = "account created"
"notify.action.update" = "role or status changed"
"notify.action.set_password" = "password reset"
"notify.action.reset_totp" = "two-step sign-in reset"
"notify.action.delete" = "account deleted"
"notify.cloud.announcement.title" = "[Cairn] Official message: {{.title}}"
"notify.cloud.announcement.body" = "A new official message was published for your Cairn installation on {{.host}}: {{.title}}. Open the message center in the panel to read it. {{.link}}"
"notify.cert.renew_failed.title" = "[Cairn] Certificate renewal failed on {{.host}}"
"notify.cert.renew_failed.body" = "The certificate {{.name}} ({{.domain}}) could not be renewed: {{.code}}. The panel tries again in 12 hours; check the certificate in the panel before it expires."
"notify.cert.expiring.title" = "[Cairn] Certificate expiring on {{.host}}"
"notify.cert.expiring.body" = "The certificate {{.name}} ({{.domain}}) expires in {{.days}} days."
"notify.app.unhealthy.title" = "[Cairn] App restarted on {{.host}}"
"notify.app.unhealthy.body" = "The app of the site {{.domain}} failed {{.failures}} health checks on {{.path}} and was restarted."
"notify.cron.failed.title" = "[Cairn] Scheduled task failed on {{.host}}"
"notify.cron.failed.body" = "The scheduled task {{.name}} ended with {{.result}} (exit code {{.exitCode}}). Its output is in the panel's task history."
"notify.backup.failed.title" = "[Cairn] Backup failed on {{.host}}"
"notify.backup.failed.body" = "The backup plan {{.name}} failed: {{.code}}. See the plan's runs in the panel."
"notify.ssh.login.title" = "[Cairn] SSH login on {{.host}}"
"notify.ssh.login.body" = "{{.user}} logged in over SSH from {{.ip}} ({{.method}}). If this was not you, check the SSH page of the panel."
"notify.firewall.rolled_back.title" = "[Cairn] Firewall change rolled back on {{.host}}"
"notify.firewall.rolled_back.body" = "A firewall change was undone because it was not confirmed within 60 seconds. The previous rules are in effect again."
"notify.firewall.rollback_failed.title" = "[Cairn] Firewall change could NOT be rolled back on {{.host}}"
"notify.firewall.rollback_failed.body" = "A firewall change was not confirmed, and undoing it failed ({{.attempts}} tries): {{.detail}}. Its rules are still in force. If you can open the panel, retry on the Firewall page; if the server cannot be reached any more, use its console."
